schema_version = "1.0.0"

id = "log_generator"
version = "0.1.0"
name = "Log Generator"
tagline = "Model railroad logs with real bark: single, car loads or log ponds"
maintainer = "John <john@singerlinks.com>"
type = "add-on"

blender_version_min = "4.5.0"

license = ["SPDX:GPL-3.0-or-later"]
tags = ["Add Mesh", "Import-Export"]

[permissions]
files = "Export logs as STL files and save presets"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "tests/",
]
